[package]
name = "simple-blog"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A small, writing-focused, single-owner dynamic CMS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/simple-blog"
readme = "README.md"
keywords = ["axum", "blog", "cms", "markdown", "sqlite"]
categories = ["command-line-utilities", "web-programming::http-server"]
default-run = "simple-blog"

[lib]
name = "simple_blog"
path = "src/lib.rs"

[[bin]]
name = "simple-blog"
path = "src/main.rs"

[dependencies]
ammonia = "4.1"
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.4", features = ["form", "http1", "json", "macros", "multipart", "query", "tokio"] }
base64 = "0.23"
blake3 = "1.8"
chrono = { version = "0.4.41", features = ["clock", "serde"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
comrak = { version = "0.54", default-features = false }
dashmap = "6.1"
flate2 = "1.1"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
httpdate = "1.0"
image = { version = "0.25.6", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.22"
kamadak-exif = "0.6"
mime_guess = "2.0"
minijinja = { version = "2.11", features = ["builtins", "json", "loader"] }
percent-encoding = "2.3"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.11"
slug = "0.1"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
subtle = "2.6"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.46", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
unicode-normalization = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-full", "limit", "normalize-path", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["serde", "v4"] }
walkdir = "2.5"
webauthn-rs = "0.5.2"
webpkit = { version = "0.1.0", features = ["image"] }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
# webauthn-rs uses OpenSSL. A vendored Windows build keeps the binary contract
# independent of machine-global OpenSSL or vcpkg installations.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
proptest = "1.7"
scraper = "0.27"
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = true

[lints.rust]
unsafe_code = "forbid"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
case_sensitive_file_extension_comparisons = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
dbg_macro = "deny"
enum_glob_use = "warn"
fn_params_excessive_bools = "warn"
items_after_statements = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
match_wild_err_arm = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
panic_in_result_fn = "warn"
redundant_closure_for_method_calls = "warn"
todo = "deny"
too_many_lines = "warn"
unimplemented = "deny"
unnecessary_wraps = "warn"
unwrap_in_result = "warn"
unused_async = "warn"
unused_self = "warn"
wildcard_imports = "warn"
