name: Reproducible verification
description: Run the same checks locally and in CI, retaining safe evidence on every outcome.
inputs:
  checks:
    description: Space separated names from scripts/verification.config.mjs
    required: true
  toolchain:
    description: Rust toolchain used by every cargo subprocess
    default: stable
  artifact-suffix:
    description: Unique suffix for parallel verification shards
    default: primary
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      timeout-minutes: 2
      with:
        node-version: 24
    - name: Verify
      shell: bash
      env:
        VERIFY_CHECKS: ${{ inputs.checks }}
        RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}
      run: node scripts/verify.mjs
    - name: Prepare shareable evidence
      id: export
      if: always()
      shell: bash
      run: node scripts/collect-evidence.mjs
    - name: Retain evidence for 30 days
      if: ${{ always() && steps.export.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: evidence-${{ github.job }}-${{ runner.os }}-${{ inputs.toolchain }}-${{ inputs.artifact-suffix }}
        path: target/shareable/
        retention-days: 30
        if-no-files-found: error
