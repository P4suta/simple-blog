name: Bug report
description: Report a reproducible failure with diagnostic evidence
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include setup URLs, recovery codes, cookies, or other secrets.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, architecture, filesystem, and reverse proxy
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command or HTTP sequence and the smallest required data.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stable error codes and request IDs when available.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic evidence
      description: Attach redacted structured logs and `simple-blog doctor --json` output.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, setup URLs, recovery codes, cookies, and private content.
          required: true
