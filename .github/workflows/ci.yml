name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "30"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned repository tools
        run: |
          mkdir -p "$RUNNER_TEMP/repository-tools"
          GOBIN="$RUNNER_TEMP/repository-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          GOBIN="$RUNNER_TEMP/repository-tools" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Make repository tools available
        run: echo "$RUNNER_TEMP/repository-tools" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        with:
          checks: policy workflows secrets

  msrv:
    name: MSRV 1.96 contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "60"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Record toolchain
        run: rustc +1.96.0 --version --verbose
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        with:
          checks: format lint rust
          toolchain: 1.96.0

  stable:
    name: Stable compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "60"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        with:
          checks: ${{ runner.os == 'Linux' && 'lint doc rust' || 'rust' }}

  frontend:
    name: Embedded frontend is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "15"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/verification
        with:
          checks: frontend

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "30"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --version 0.19.7 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        with:
          checks: dependencies

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "45"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo +stable install cargo-llvm-cov --version 0.9.0 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        with:
          checks: coverage

  release-smoke:
    name: Release binary contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "60"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV
        timeout-minutes: 10
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Build without development-time Node.js
        timeout-minutes: 30
        run: |
          mkdir -p target/verification
          cargo +1.96.0 build --release --locked >target/verification/release-build.log 2>&1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        if: always()
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        if: always()
        with:
          checks: symbols release-smoke
          toolchain: 1.96.0

  windows-symbols:
    name: Windows release symbols
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "60"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        with:
          checks: release

  browser-recovery:
    name: Browser and recovery evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "90"
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: rustup toolchain install stable --profile minimal
      - run: bun install --frozen-lockfile
      - name: Install the three pinned browser engines
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/playwright-browsers
        run: bun x playwright install --with-deps chromium firefox webkit
      - uses: ./.github/actions/verification
        with:
          checks: browser performance

  adversarial-shards:
    name: Parser and critical decision shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERIFY_JOB_TIMEOUT_MINUTES: "360"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Start the verification deadline
        shell: bash
        run: echo "VERIFY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install stable nightly --profile minimal --component rust-src
      - run: cargo +stable install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +stable install cargo-mutants --version 27.1.0 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
      - uses: ./.github/actions/verification
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_SHARD_INDEX: ${{ matrix.shard }}
          VERIFY_SHARD_COUNT: 8
        with:
          checks: deep-pr
          artifact-suffix: shard-${{ matrix.shard }}

  adversarial:
    name: Parser and critical decision evidence
    if: always()
    needs: adversarial-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.adversarial-shards.result }}
        run: test "$SHARD_RESULT" = success
