{% extends "admin/base.html" %}
{% block content %}
<header class="admin-page-head"><div><p class="kicker">Dashboard</p><h1>文章</h1></div><a class="primary-button" href="/admin/content/new/">新しい文章</a></header>
<div class="content-table" role="list">
{% for item in contents %}<a role="listitem" href="/admin/content/{{ item.id }}/edit/"><span><strong>{{ item.title }}</strong><small>/{{ item.slug }}/</small></span><span class="status">{{ item.status }}</span></a>{% else %}<p>まだ文章がありません。最初の一篇を書きましょう。</p>{% endfor %}
</div>
{% endblock %}
