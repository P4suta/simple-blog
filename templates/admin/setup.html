<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t["setup.title"] }} — {{ t["admin.brand"] }}</title><link rel="stylesheet" href="/admin/assets/admin.css"><script src="/admin/assets/admin.js" defer></script></head><body class="auth-body"><main class="auth-card" data-passkey-setup data-setup-token="{{ token }}" data-msg-recovery-heading="{{ t["recovery.heading"] }}" data-msg-recovery-note="{{ t["recovery.note"] }}" data-msg-to-admin="{{ t["recovery.to_admin"] }}"><p class="kicker">{{ t["setup.kicker"] }}</p><h1>{{ t["setup.heading"] }}</h1><p>{{ t["setup.note"] }}</p><label>{{ t["setup.passkey_name"] }}<input data-passkey-name value="Main device" maxlength="80"></label><button class="primary-button" type="button" data-passkey-action>{{ t["setup.create"] }}</button><p data-auth-error role="alert"></p></main></body></html>
