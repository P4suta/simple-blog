<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t["login.title"] }} — {{ t["admin.brand"] }}</title><link rel="stylesheet" href="/admin/assets/admin.css"><script src="/admin/assets/admin.js" defer></script></head><body class="auth-body"><main class="auth-card" data-passkey-login data-next="{{ next }}"><p class="kicker">{{ t["login.kicker"] }}</p><h1>{{ t["login.heading"] }}</h1><p>{{ t["login.note"] }}</p><button class="primary-button" type="button" data-passkey-action>{{ t["login.continue"] }}</button><p data-auth-error role="alert"></p><details><summary>{{ t["login.recovery_toggle"] }}</summary><form method="post" action="/admin/auth/recovery"><label>{{ t["login.recovery_code"] }}<input name="code" autocomplete="one-time-code" required></label><button class="primary-button" type="submit">{{ t["login.recover"] }}</button></form></details></main></body></html>
