{% extends "public/base.html" %}
{% block content %}
<header class="page-header"><h1>{{ page.heading }}</h1></header>
{% for group in page.years %}
<section class="archive-year">
  <h2>{{ group.year }}</h2>
  <table class="archive-list">
    <tbody>
{% for post in group.posts %}      <tr><td><time datetime="{{ post.publish_at }}">{{ post.date_short }}</time></td><td><a href="/{{ post.slug }}/">{{ post.title }}</a></td></tr>
{% endfor %}
    </tbody>
  </table>
</section>
{% else %}
<p>{{ t["public.empty_archive"] }}</p>
{% endfor %}
{% endblock %}
