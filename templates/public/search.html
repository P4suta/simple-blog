{% extends "public/base.html" %}
{% block content %}
<header class="page-header"><h1>{{ t["public.search"] }}</h1></header>
{# The page is one immutable file; the script fills in the results from the
   versioned index. Without a script the archive is the way to browse. #}
<form class="search-form" action="/search/" method="get" role="search" data-static-search data-index="{{ page.search_index_url }}">
  <input type="search" name="q" placeholder="{{ t["public.search_placeholder"] }}" aria-label="{{ t["public.search"] }}" maxlength="120" autofocus>
  <button type="submit">{{ t["public.search"] }}</button>
</form>
<p class="empty" data-search-status data-empty="{{ t["public.search_empty"] }}" data-loading="{{ t["public.search_loading"] }}" data-failed="{{ t["public.search_failed"] }}"></p>
<section class="post-list search-results" data-search-results aria-label="{{ t["public.search"] }}" hidden></section>
<noscript><p class="empty">{{ t["public.search_noscript"] }} <a href="/archive/">{{ t["public.archive"] }}</a></p></noscript>
<script src="/assets/search.js?v={{ page.search_js_version }}" defer></script>
{% endblock %}
